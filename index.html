<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>graef</title>
    <link rel="shortcut icon" href="favicon.svg" type="image/svg" />
    <meta name="description" content="graef" />
    <style>
*{margin:0;padding:0;box-sizing:border-box;}
:root {
  color-scheme: light dark;
  --fg: light-dark(#0a0a0a, #fafafe);
  --bg: light-dark(#f7f5f0, #0a0a0a);
  --txt: #999;
  /* further variables */
  --list-gap: 12px;
}
html {
  font-family: "M Plus 2", sans-serif;
  text-align: center;
}
body {
  color: var(--txt);
  background-color: var(--bg);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4rem;
  padding: 16px 32px;
  max-width: 400px;
  flex-grow: 1;
}
header, footer {
  margin-top: auto;
}
img {
  border-radius: 8px;
}
h1 {
  letter-spacing: 0.38em;
  text-transform: uppercase;
  font-weight: 400;
  white-space: nowrap;
}
h2 {
  color: var(--fg);
  letter-spacing: 0.21em;
  text-transform: uppercase;
  font-weight: 600;
  white-space: nowrap;
}
header img {
  display: grid;
  grid-template-columns: max-content;
  align-items: center;
}
section h2 {
  margin-bottom: 16px;
}
ul {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: var(--list-gap);
  align-items: center;
  justify-content: center;
}
    </style>
  </head>

  <body>
    <main>
      <header>
        <img
          src="assets/profile-picture.webp"
          alt="The image that graef uses as this profile picture."
          width="96"
          height="96"
        />
      </header>

      <section>
        <h2>graefchen</h2>
        <p>
          I am an archaology and computer linguistic student with an bachelor in
          conputing science and am interesetind in creating video games, the
          small web, simple living and much much more...
        </P>
      </section>

      <footer>
        <p>Ultra-low consumption website. Created in 2025.</p>
      </footer>
    </main>

  </body>
</html>
